<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مدیریت کارت‌های بانکی</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- کتابخانه تولید QR کد واقعی -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            font-family: 'Vazirmatn', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding-bottom: 90px;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .bank-card {
            aspect-ratio: 1.586 / 1;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .card-chip {
            width: 42px;
            height: 32px;
            background: linear-gradient(135deg, #ffe082 0%, #ffb300 100%);
            border-radius: 6px;
            position: relative;
        }
        .shimmer-effect {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(125deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 70%);
            pointer-events: none;
        }
        .force-ltr {
            direction: ltr !important;
            text-align: left !important;
            unicode-bidi: isolate !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes pulse-mic {
            0%, 100% { background-color: rgba(225, 29, 72, 0.3); color: #f43f5e; border-color: #f43f5e; }
            50% { background-color: rgba(225, 29, 72, 0.9); color: #ffffff; border-color: #f43f5e; box-shadow: 0 0 15px rgba(244,63,94,0.6); }
        }
        .listening {
            animation: pulse-mic 1.2s infinite ease-in-out;
        }

        #qrcode img, #qrcode canvas {
            margin: 0 auto;
            border-radius: 12px;
            padding: 12px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 antialiased">

    <!-- Header -->
    <header class="w-full max-w-md sticky top-0 z-30 pt-4 pb-3 mb-3 glass-panel rounded-2xl px-5 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/30 text-indigo-400 flex items-center justify-center border border-indigo-500/20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <div>
                <h1 class="text-lg font-bold leading-tight">کارت‌های من</h1>
                <p class="text-xs text-slate-400" id="cardCountText">۰ کارت ثبت شده</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button type="button" onclick="showAllCardsQR()" class="bg-amber-600/20 border border-amber-500/30 text-amber-400 hover:bg-amber-600 hover:text-white px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                <span>QR کلی</span>
            </button>
            <button type="button" onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-lg shadow-indigo-600/30">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>کارت جدید</span>
            </button>
        </div>
    </header>

    <!-- Search Input -->
    <div class="w-full max-w-md mb-4">
        <div class="relative flex items-center">
            <svg class="w-4 h-4 absolute right-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" id="searchInput" oninput="renderCards()" placeholder="جستجو بر اساس نام بانک، نام شخص یا شماره کارت..."
                class="w-full bg-slate-900 border border-slate-800 rounded-xl pr-10 pl-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        </div>
    </div>

    <!-- Cards List -->
    <main id="cardsList" class="w-full max-w-md flex flex-col gap-5"></main>

    <!-- Empty State -->
    <div id="emptyState" class="hidden w-full max-w-md flex-col items-center justify-center py-16 px-4 text-center">
        <div class="w-20 h-20 rounded-full bg-slate-800/80 flex items-center justify-center text-slate-500 mb-4 border border-slate-700/50">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        </div>
        <h3 class="text-base font-semibold text-slate-300 mb-1">کارت بانکی یافت نشد</h3>
        <p class="text-xs text-slate-500 mb-6">برای افزودن کارت، دکمه زیر را فشار دهید.</p>
        <button type="button" onclick="openAddModal()" class="bg-slate-800 text-indigo-400 border border-indigo-500/30 px-5 py-2.5 rounded-xl text-sm">
            افزودن کارت جدید
        </button>
    </div>

    <!-- Modal QR Code -->
    <div id="qrModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center hidden p-4">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                    <span>QR کد تمام کارت‌ها</span>
                </h3>
                <button type="button" onclick="closeQRModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <p class="text-xs text-slate-400 mb-4">با اسکن این QR کد، لیست تمام کارت‌ها برای انتخاب باز می‌شود.</p>

            <div id="qrcode" class="flex justify-center my-4 min-h-[200px] items-center"></div>

            <button type="button" onclick="closeQRModal()" class="w-full mt-4 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-semibold">
                بستن
            </button>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="cardModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center hidden">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar">
            
            <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <h3 id="modalTitle" class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <span>ثبت اطلاعات کارت</span>
                </h3>
                <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Card Preview -->
            <div class="mb-5">
                <div id="previewCard" class="bank-card p-5 text-white flex flex-col justify-between shadow-md" style="background: linear-gradient(135deg, #1e293b, #334155);">
                    <div class="shimmer-effect"></div>
                    <div class="flex justify-between items-start z-10">
                        <span id="previewBankName" class="font-extrabold text-sm tracking-wide opacity-90">کارت بانکی</span>
                        <div class="card-chip"></div>
                    </div>
                    <div id="previewNumber" class="text-lg force-ltr font-bold text-center z-10 my-2 tracking-widest">
                        •••• •••• •••• ••••
                    </div>
                    <div class="flex justify-between items-end z-10 text-xs">
                        <div>
                            <div class="text-[10px] opacity-75">صاحب کارت</div>
                            <div id="previewHolder" class="font-semibold">--- ---</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form -->
            <form id="cardForm" onsubmit="handleSaveCard(event)" class="space-y-4">
                <input type="hidden" id="cardId">

                <!-- Card Number with Voice Button -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">شماره کارت (۱۶ رقم)</label>
                    <div class="relative flex items-center">
                        <input type="text" id="inputCardNumber" inputmode="numeric" maxlength="19" required
                            placeholder="XXXX XXXX XXXX XXXX"
                            oninput="onCardNumberInput(this)"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-24 pr-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 force-ltr">
                        
                        <button type="button" id="btnVoiceCard" onclick="startVoiceInput('card')" title="خواندن شماره کارت"
                            class="absolute left-1.5 px-2.5 py-1.5 rounded-lg bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 hover:bg-indigo-600 hover:text-white flex items-center gap-1 text-[11px] font-medium transition-all">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"></path></svg>
                            <span>خواندن</span>
                        </button>
                    </div>
                </div>

                <!-- Holder Name with Voice Button -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">نام صاحب حساب / کارت</label>
                    <div class="relative flex items-center">
                        <input type="text" id="inputHolder" required placeholder="مثال: علی محمدی"
                            oninput="document.getElementById('previewHolder').innerText = this.value || '--- ---'"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-24 pr-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                        
                        <button type="button" id="btnVoiceHolder" onclick="startVoiceInput('holder')" title="گفتن نام"
                            class="absolute left-1.5 px-2.5 py-1.5 rounded-lg bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 hover:bg-indigo-600 hover:text-white flex items-center gap-1 text-[11px] font-medium transition-all">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"></path></svg>
                            <span>خواندن</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">شماره حساب (اختیاری)</label>
                    <input type="text" id="inputAccount" inputmode="numeric" placeholder="مثال: 0102030405001"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 force-ltr">
                </div>

                <!-- IBAN with Voice Button -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">شماره شبا - بدون IR (اختیاری)</label>
                    <div class="relative flex items-center">
                        <span class="absolute right-3 text-slate-500 font-bold text-xs">IR</span>
                        <input type="text" id="inputIban" inputmode="numeric" maxlength="24" placeholder="۲۴ رقم شماره شبا"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl pr-9 pl-24 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 force-ltr">
                        
                        <button type="button" id="btnVoiceIban" onclick="startVoiceInput('iban')" title="خواندن شبا"
                            class="absolute left-1.5 px-2.5 py-1.5 rounded-lg bg-amber-600/20 border border-amber-500/30 text-amber-400 hover:bg-amber-600 hover:text-white flex items-center gap-1 text-[11px] font-medium transition-all">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"></path></svg>
                            <span>خواندن</span>
                        </button>
                    </div>
                </div>

                <div class="pt-3 flex gap-3">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 text-slate-300 py-3 rounded-xl text-sm font-semibold">انصراف</button>
                    <button type="submit" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30">ذخیره کارت</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-4 py-2.5 rounded-full text-xs font-medium shadow-xl opacity-0 pointer-events-none transition-all duration-300">
        <span id="toastMessage">کپی شد</span>
    </div>

    <script>
        const BANK_DATA = {
            "606373": { name: "بانک مهر ایران", bg: "linear-gradient(135deg, #059669, #047857)", textColor: "text-white" },
            "639370": { name: "بانک مهر ایران", bg: "linear-gradient(135deg, #059669, #047857)", textColor: "text-white" },
            "589463": { name: "بانک رفاه کارگران", bg: "linear-gradient(135deg, #1e3a8a, #3b82f6)", textColor: "text-white" },
            "603799": { name: "بانک ملی ایران", bg: "linear-gradient(135deg, #0f3854, #1a5b88)", textColor: "text-white" },
            "610433": { name: "بانک ملت", bg: "linear-gradient(135deg, #a71d2a, #e53935)", textColor: "text-white" },
            "603769": { name: "بانک صادرات", bg: "linear-gradient(135deg, #0a2540, #1e4976)", textColor: "text-white" },
            "621986": { name: "بانک سامان", bg: "linear-gradient(135deg, #006680, #00a8cc)", textColor: "text-white" },
            "502229": { name: "بانک پاسارگاد", bg: "linear-gradient(135deg, #1c1917, #d97706)", textColor: "text-white" },
            "627353": { name: "بانک تجارت", bg: "linear-gradient(135deg, #154c79, #2071b5)", textColor: "text-white" },
            "589210": { name: "بانک سپه", bg: "linear-gradient(135deg, #b45309, #f59e0b)", textColor: "text-white" },
            "622106": { name: "بانک پارسیان", bg: "linear-gradient(135deg, #701a75, #a21caf)", textColor: "text-white" },
            "504172": { name: "بانک رسالت", bg: "linear-gradient(135deg, #0f766e, #14b8a6)", textColor: "text-white" },
            "636214": { name: "بانک آینده", bg: "linear-gradient(135deg, #4c1d95, #7c3aed)", textColor: "text-white" },
            "603770": { name: "بانک کشاورزی", bg: "linear-gradient(135deg, #14532d, #16a34a)", textColor: "text-white" },
            "628023": { name: "بانک مسکن", bg: "linear-gradient(135deg, #c2410c, #ea580c)", textColor: "text-white" }
        };

        const DEFAULT_BANK = { name: "کارت بانکی", bg: "linear-gradient(135deg, #1e293b, #334155)", textColor: "text-white" };

        let cards = [];
        let recognition = null;

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('my_bank_cards');
            if (saved) {
                try { cards = JSON.parse(saved); } catch (e) { cards = []; }
            }
            renderCards();
        });

        function saveToStorage() {
            localStorage.setItem('my_bank_cards', JSON.stringify(cards));
            renderCards();
        }

        function getBankInfo(cardNumber) {
            const clean = cardNumber.replace(/\D/g, '');
            const prefix = clean.slice(0, 6);
            return BANK_DATA[prefix] || DEFAULT_BANK;
        }

        function formatCardNumber(value) {
            const clean = value.replace(/\D/g, '').slice(0, 16);
            return clean.replace(/(.{4})/g, '$1 ').trim();
        }

        function onCardNumberInput(input) {
            const formatted = formatCardNumber(input.value);
            input.value = formatted;
            
            document.getElementById('previewNumber').innerText = formatted || '•••• •••• •••• ••••';

            const bankInfo = getBankInfo(formatted);
            const previewCard = document.getElementById('previewCard');
            
            previewCard.style.background = bankInfo.bg;
            previewCard.className = `bank-card p-5 ${bankInfo.textColor} flex flex-col justify-between shadow-md`;
            document.getElementById('previewBankName').innerText = bankInfo.name;
        }

        function renderCards() {
            const listEl = document.getElementById('cardsList');
            const emptyEl = document.getElementById('emptyState');
            const searchQuery = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';

            document.getElementById('cardCountText').innerText = `${cards.length} کارت ثبت شده`;
            listEl.innerHTML = '';

            const filteredCards = cards.filter(card => {
                const bank = getBankInfo(card.cardNumber);
                const matchBank = bank.name.toLowerCase().includes(searchQuery);
                const matchHolder = card.holder.toLowerCase().includes(searchQuery);
                const matchNumber = card.cardNumber.replace(/\s/g, '').includes(searchQuery);
                const matchIban = (card.iban || '').includes(searchQuery);
                return matchBank || matchHolder || matchNumber || matchIban;
            });

            if (filteredCards.length === 0) {
                emptyEl.classList.remove('hidden');
                emptyEl.classList.add('flex');
                return;
            } else {
                emptyEl.classList.add('hidden');
            }

            filteredCards.forEach((card) => {
                const realIndex = cards.indexOf(card);
                const bank = getBankInfo(card.cardNumber);
                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'glass-panel rounded-3xl p-4 flex flex-col gap-3 relative border border-slate-800';

                cardWrapper.innerHTML = `
                    <div class="bank-card p-5 ${bank.textColor} flex flex-col justify-between shadow-md" style="background: ${bank.bg}">
                        <div class="shimmer-effect"></div>
                        <div class="flex justify-between items-start z-10">
                            <span class="font-extrabold text-sm opacity-95">${bank.name}</span>
                            <div class="card-chip"></div>
                        </div>
                        <div class="text-xl force-ltr font-bold text-center z-10 my-3">
                            ${card.cardNumber}
                        </div>
                        <div class="flex justify-between items-end z-10 text-xs">
                            <div>
                                <div class="text-[10px] opacity-75">صاحب کارت</div>
                                <div class="font-semibold">${card.holder}</div>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-2 text-xs">
                        <div class="flex items-center justify-between bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                            <span class="text-slate-400">شماره کارت:</span>
                            <span class="force-ltr text-slate-200">${card.cardNumber}</span>
                            <button onclick="copyToClipboard('${card.cardNumber.replace(/\s/g, '')}', 'شماره کارت')" class="text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-lg">کپی</button>
                        </div>
                        ${card.account ? `
                        <div class="flex items-center justify-between bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                            <span class="text-slate-400">حساب:</span>
                            <span class="force-ltr text-slate-200">${card.account}</span>
                            <button onclick="copyToClipboard('${card.account}', 'شماره حساب')" class="text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg">کپی</button>
                        </div>` : ''}
                        ${card.iban ? `
                        <div class="flex items-center justify-between bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                            <span class="text-slate-400">شبا:</span>
                            <span class="force-ltr text-slate-200">IR${card.iban}</span>
                            <button onclick="copyToClipboard('IR${card.iban}', 'شماره شبا')" class="text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-lg">کپی</button>
                        </div>` : ''}
                    </div>

                    <div class="flex items-center justify-end pt-2 border-t border-slate-800/80 text-xs text-slate-400 gap-3">
                        <button onclick="editCard(${realIndex})" class="hover:text-indigo-400 flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 002-2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            <span>ویرایش</span>
                        </button>
                        <button onclick="deleteCard(${realIndex})" class="text-rose-400 hover:text-rose-300 flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            <span>حذف</span>
                        </button>
                    </div>
                `;
                listEl.appendChild(cardWrapper);
            });
        }

        // تولید QR کد کلی حاوی تمام کارت‌ها برای اسکن‌کننده
        function showAllCardsQR() {
            if (cards.length === 0) {
                alert('هیچ کارتی برای ساخت QR کد وجود ندارد!');
                return;
            }

            // ساخت یک صفحه HTML اختصاصی درون داده‌های QR برای نمایش لیست کارت‌ها
            let cardsHtml = cards.map((c, idx) => {
                const b = getBankInfo(c.cardNumber);
                return `
                <div style="background:#1e293b;border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid #334155;text-align:right;">
                    <div style="color:#fbbf24;font-size:12px;font-weight:bold;">${b.name}</div>
                    <div style="color:#ffffff;font-size:11px;margin-top:2px;">صاحب حساب: ${c.holder}</div>
                    <div style="background:#0f172a;padding:8px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;">
                        <span style="color:#38bdf8;font-family:monospace;font-weight:bold;font-size:13px;direction:ltr;">${c.cardNumber}</span>
                        <button onclick="navigator.clipboard.writeText('${c.cardNumber.replace(/\s/g, '')}');alert('شماره کارت کپی شد');" style="background:#4f46e5;color:#fff;border:none;padding:4px 8px;border-radius:6px;font-size:10px;">کپی</button>
                    </div>
                    ${c.iban ? `
                    <div style="background:#0f172a;padding:8px;border-radius:8px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;">
                        <span style="color:#f59e0b;font-family:monospace;font-weight:bold;font-size:11px;direction:ltr;">IR${c.iban}</span>
                        <button onclick="navigator.clipboard.writeText('IR${c.iban}');alert('شماره شبا کپی شد');" style="background:#d97706;color:#fff;border:none;padding:4px 8px;border-radius:6px;font-size:10px;">کپی</button>
                    </div>` : ''}
                </div>`;
            }).join('');

            let fullPage = `data:text/html;charset=utf-8,` + encodeURIComponent(`
                <!DOCTYPE html>
                <html lang="fa" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>انتخاب کارت جهت واریز</title>
                    <style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:15px;margin:0;}</style>
                </head>
                <body>
                    <h3 style="text-align:center;font-size:14px;color:#cbd5e1;margin-bottom:15px;">کارت مورد نظر خود را انتخاب و کپی کنید</h3>
                    ${cardsHtml}
                </body>
                </html>
            `);

            const container = document.getElementById('qrcode');
            container.innerHTML = '';

            new QRCode(container, {
                text: fullPage,
                width: 200,
                height: 200,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.L
            });

            document.getElementById('qrModal').classList.remove('hidden');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        function convertPersianToDigits(str) {
            const p2e = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
            const a2e = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
            let res = str.replace(/[۰-۹]/g, w => p2e[w]).replace(/[٠-٩]/g, w => a2e[w]);
            return res.replace(/\D/g, '');
        }

        function startVoiceInput(targetField) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('مرورگر شما از قابلیت تشخیص گفتار پشتیبانی نمی‌کند.');
                return;
            }

            let btnId = targetField === 'card' ? 'btnVoiceCard' : (targetField === 'holder' ? 'btnVoiceHolder' : 'btnVoiceIban');
            const btn = document.getElementById(btnId);

            if (recognition) {
                recognition.stop();
                recognition = null;
                btn.classList.remove('listening');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR';
            recognition.continuous = true;
            recognition.interimResults = true;

            btn.classList.add('listening');
            showToast('در حال شنیدن... بگوئید تا تایپ شود');

            recognition.onresult = (event) => {
                let currentText = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentText += event.results[i][0].transcript;
                }

                if (targetField === 'card') {
                    const digits = convertPersianToDigits(currentText);
                    const input = document.getElementById('inputCardNumber');
                    input.value = formatCardNumber(digits);
                    onCardNumberInput(input);
                } else if (targetField === 'iban') {
                    const digits = convertPersianToDigits(currentText);
                    document.getElementById('inputIban').value = digits.slice(0, 24);
                } else if (targetField === 'holder') {
                    document.getElementById('inputHolder').value = currentText;
                    document.getElementById('previewHolder').innerText = currentText || '--- ---';
                }
            };

            recognition.onerror = () => {
                btn.classList.remove('listening');
            };

            recognition.onend = () => {
                btn.classList.remove('listening');
                recognition = null;
            };

            recognition.start();
        }

        function openAddModal(reset = true) {
            if(reset) {
                document.getElementById('cardId').value = '';
                document.getElementById('cardForm').reset();
                onCardNumberInput(document.getElementById('inputCardNumber'));
            }
            document.getElementById('cardModal').classList.remove('hidden');
        }

        function closeModal() {
            if (recognition) { recognition.stop(); }
            document.getElementById('cardModal').classList.add('hidden');
        }

        function handleSaveCard(e) {
            e.preventDefault();
            const id = document.getElementById('cardId').value;
            const number = document.getElementById('inputCardNumber').value;
            const holder = document.getElementById('inputHolder').value;
            const account = document.getElementById('inputAccount').value;
            const iban = document.getElementById('inputIban').value.replace(/\D/g, '');

            if (number.length < 19) {
                alert('لطفاً ۱۶ رقم شماره کارت را کامل وارد کنید.');
                return;
            }

            const data = { cardNumber: number, holder, account, iban };

            if (id !== '') cards[parseInt(id)] = data;
            else cards.push(data);

            saveToStorage();
            closeModal();
            showToast('اطلاعات کارت ذخیره شد');
        }

        function editCard(index) {
            const card = cards[index];
            document.getElementById('cardId').value = index;
            document.getElementById('inputCardNumber').value = card.cardNumber;
            document.getElementById('inputHolder').value = card.holder;
            document.getElementById('inputAccount').value = card.account || '';
            document.getElementById('inputIban').value = card.iban || '';
            
            onCardNumberInput(document.getElementById('inputCardNumber'));
            document.getElementById('cardModal').classList.remove('hidden');
        }

        function deleteCard(index) {
            if (confirm('آیا از حذف این کارت اطمینان دارید؟')) {
                cards.splice(index, 1);
                saveToStorage();
                showToast('کارت با موفقیت حذف شد');
            }
        }

        function copyToClipboard(text, msg) {
            navigator.clipboard.writeText(text);
            showToast(`${msg} کپی شد`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2200);
        }
    </script>
</body>
</html>
